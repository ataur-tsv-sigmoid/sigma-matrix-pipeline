# .streamlit/secrets.toml
# ── Feature 1: SNS Email Alerting ─────────────────────────────────────────────
# Replace the value below with your actual SNS Topic ARN.
# Create the topic:  aws sns create-topic --name sigma-matrix-alerts --region us-east-1
# Subscribe email:   aws sns subscribe --topic-arn <ARN> --protocol email --notification-endpoint you@example.com
SNS_TOPIC_ARN = "arn:aws:sns:us-east-1:123456789012:sigma-matrix-alerts"

# ── Future: Slack integration (uncomment when ready) ──────────────────────────
# SLACK_WEBHOOK_URL = "https://hooks.slack.com/services/XXX/YYY/ZZZ"
